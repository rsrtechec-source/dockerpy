apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dockerpy
spec:
  ingressClassName: traefik
  rules:
    - host: dockerpy.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dockerpy
                port:
                  number: 80
